name: Training Pipeline (daily)

# Retrains the models every day on whatever data has accumulated in
# data/features.csv, and commits the updated model files back to the repo.

on:
  schedule:
    - cron: "0 2 * * *"   # once a day at 02:00 UTC
  workflow_dispatch:

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: python training_pipeline.py

      - name: Commit updated models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated: retrain models"
          git push
